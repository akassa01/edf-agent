  - "Fitzmaurice, Malgosia. 'The Gabcikovo-Nagymaros Case: The Law of Treaties.' Leiden Journal of International Law 11(2), 1998: 321-344. Verified: peer-reviewed law journal, available via JSTOR."
  - "Boyle, Alan. 'The Gabcikovo-Nagymaros Case: New Law in Old Bottles.' Yearbook of International Environmental Law 8(1), 1997: 13-20. Verified: Oxford Journals, available via JSTOR."
  - "Wilson Center. 'Solving the Gabcikovo-Nagymaros Dam Conflict.' Working Paper 171, Woodrow Wilson International Center for Scholars. Verified: publicly available at wilsoncenter.org."
