# ── Three perspectives (all required) ────────────────────────────────────────

scientist: |
  What did Dutchbat III know, and when? The NIOD report (2002) — the most comprehensive
  official investigation into the events — establishes a gradient of knowledge.
  Dutch troops had observed Bosnian Serb encirclement for weeks. They knew they were
  vastly outnumbered: roughly 400 lightly armed soldiers against 15,000 Serb
  paramilitaries with armor. Their requests for NATO air support had been denied by
  UNPROFOR command, which operated under the dual-key structure requiring both the
  UN Secretary-General's representative and NATO to authorize strikes — a structure
  that had been paralyzed since May 1995, when 450 UN peacekeepers were taken hostage
  after an earlier strike. The scientist's reading: at the moment of crisis, the
  epistemic state was incomplete but not blank. Karremans did not know the scale of
  what Mladic intended. He did know, from the evidence before him, that handing over
  civilian men to an enemy force whose stated intentions were unverified was not
  consistent with "protection."

humanist: |
  The 40,000 Bosnian Muslims in the Srebrenica enclave had lived alongside Dutch troops
  for three years. The enclave's designation as a UN "safe area" had become a reason
  not to evacuate — the UN label replaced individual flight judgment with collective
  institutional trust. The felt experience at Potočari on July 12, 1995 — the heat,
  40,000 people in a space designed for a few hundred, men walking away toward buses
  as women watched — was processed by Dutch soldiers primarily as operational stress,
  not moral emergency. Three Dutch soldiers testified for the prosecution at trial:
  they described the panic, the separation, the removal of girls from the crowd, the
  killings they witnessed. The operational framework gave soldiers a category for their
  feelings that was not "moral emergency requiring individual defiance." The humanist
  reads the gap between what soldiers saw and what the framework told them they were
  doing as the failure's deepest register.

engineer: |
  The safe area concept was an engineering solution to a political problem: create a
  UN-protected zone without resolving the political conflict that made the zone
  necessary. It was designed to deter by presence — not by force. The output
  specification ("protect civilians") was fundamentally incompatible with the input
  specification ("no force"). This is a system design failure, upstream of Karremans.
  He inherited a machine designed to fail under load. The engineer's reading of his
  available moves: escalate requests for air support more aggressively and directly
  to Dutch political leadership, bypassing the frozen UNPROFOR chain of command;
  formally declare the mandate unworkable and shift objective to documentation and
  evacuation; refuse Dutch operational cooperation with the separation at the compound
  gate. None of these moves would have been costless, and some might not have worked.
  The engineer sees that none of them was tried.

archetype_dominant: engineer
crowded_out_mode: feeling (moral recognition that operational compliance had crossed into active complicity)

# ── Diagnosis ────────────────────────────────────────────────────────────────

scientific_facts: |
  Dutchbat III: approximately 400 lightly armed Dutch soldiers in a 500 km² enclave.
  Enclave population: approximately 40,000 Bosnian Muslims. Serb forces: approximately
  15,000 with armor and artillery. Air support requests: denied by UNPROFOR command
  on July 11, after initial partial strikes on July 11 that were halted. The dual-key
  NATO/UN authorization structure had been functionally paralyzed since the May 1995
  hostage crisis. The massacre: approximately 8,373 Bosniak men and boys were killed
  between July 11–17, 1995 — the largest mass killing in Europe since the Holocaust,
  per the International Court of Justice. The Dutch state was found legally liable for
  10% of approximately 350 deaths specifically associated with Dutch operational
  decisions at the Potočari compound. The NIOD report's publication in 2002 triggered
  the resignation of the entire Dutch government.

social_facts: |
  The UN safe area designation had become a double-edged guarantee: it discouraged
  individual flight from the enclave (why leave if you are protected?) while providing
  no practical protection when tested. Mladic understood the Dutch mandate's
  constraints better than the Dutch chain of command understood them: he knew that
  Dutchbat had no authorization to use force and that the dual-key structure would
  prevent air strikes under the political conditions of July 1995. Dutch troops were
  demoralized, undersupplied, and had endured their colleagues being taken hostage six
  weeks earlier. The Dutch Parliamentary election was three days away (July 14). These
  conditions were not invisible to Mladic.

political_realities: |
  The Dutch government's immediate priority was the safe return of Dutch troops. The
  Clinton administration had become disillusioned with air strikes as a deterrent tool
  after the May 1995 hostage crisis. The UN's dual-key command structure — requiring
  both UNPROFOR's Yasushi Akashi and NATO to authorize strikes — had produced a de
  facto moratorium on air support. At the political level, Srebrenica was a
  low-priority crisis in a negotiating landscape where the Dayton Accords (November
  1995) were already being prepared. The enclave's fall was processed in some
  political quarters as a simplification of the map problem.

uncertainty_and_ambiguity: |
  Uncertainty: Karremans did not know at the time that the men being separated and
  loaded onto buses would all be killed. Mladic had given assurances of prisoner-of-war
  treatment and exchange. Whether those assurances were believed, disbelieved, or
  suspended while Karremans sought to buy time is contested in his subsequent testimony.
  Ambiguity: the word "protect" in the mandate meant something different to everyone
  who used it. To the UN Security Council it meant "moral and political signal." To
  Dutch military planners it meant "presence as deterrence." To the 40,000 residents
  of the enclave it meant "force, if necessary." These were never reconciled.

key_tensions:
  - "Mandate compliance vs. moral agency: following the institutional framework vs. recognizing that the framework had become incoherent"
  - "Troop safety vs. civilian protection: the two were directly in conflict once the enclave fell"
  - "Rule of law (UN mandate as legitimate framework) vs. moral law (visible evidence that men walking toward buses would be shot)"

problem_definition: |
  What obligations does a peacekeeping commander have when the mandate he was given
  has become structurally incoherent — when "protect" cannot be performed without force,
  "no force" is simultaneously the mandate, and the clock is running?

# ── Metaphors ────────────────────────────────────────────────────────────────

one_plus_one: |
  Mladic was answering: "How do I complete the ethnic cleansing of Srebrenica while
  maintaining UN cooperation that provides diplomatic cover?" Karremans was answering:
  "How do I protect my troops, honor the mandate, and keep 40,000 people alive with
  400 lightly armed soldiers?" The two questions were incompatible, but the Dutch
  operational framework had no category for the incompatibility. The UN mandate was
  the mandate: it was the answer, not a tool for finding one. 1+1 produced two
  separate calculations, and Mladic's was the one that executed.

where_is_x: |
  The compound gate at Potočari on the morning of July 12, 1995, where Dutch soldiers
  were ordered to assist in separating Bosnian men from women and children for
  transport onto Serb-controlled buses. This is the precise fulcrum — the moment of
  active, operational complicity. Before this moment there were failures of omission:
  requests for air support that were insufficiently urgent, failure to escalate
  directly to Dutch political leadership, failure to formally declare the mandate
  unworkable. At the compound gate, the failure became a commission. Three Dutch
  soldiers who were at that gate testified for the prosecution. Karremans, the night
  before, had accepted a celebratory drink from Mladic on video. The camera was
  running.

eighteenth_camel: |
  The stated binary: (A) comply with Serb demands to cooperate in the separation, or
  (B) resist militarily with 400 soldiers against 15,000. The 18th camel: formal
  declaration, transmitted directly to Dutch Defense Minister and NATO Secretary-General
  by name, that the safe area mandate had collapsed and that Dutchbat's only viable
  remaining objective was evacuation and documentation; refusal to provide Dutch
  operational assistance to the separation at the compound gate (a posture, not a
  military act — Dutchbat lacked the force to stop the separation, but need not have
  facilitated it); visible positioning of Dutch soldiers as documented witnesses at
  the gate, with orders to record and report everything they saw. This does not
  prevent the massacre. It does not produce non-complicity as a clean outcome. But it
  changes what the Dutch state did, creates contemporaneous documentation that cannot
  be suppressed, and forces the political-level decision about the mandate's failure
  to be made at the political level rather than absorbed into operational compliance.

solomon_check: |
  The NIOD report documented that Dutch military analysts, reviewing comparable
  situations in other countries, had previously recommended clearer rules of engagement
  for peacekeepers in contested zones and had identified the safe area concept's
  structural incoherence in theoretical terms. The institutional wisdom was available.
  It was not directed inward, to the Srebrenica deployment. Expertise had been applied
  to the general problem; proximity to the specific deployment narrowed the vision.

urgency_vs_actionability: |
  The urgency of 40,000 civilians in danger had been escalating for weeks. The
  actionability — getting air strikes authorized through the dual-key structure, getting
  the mandate changed through the UN chain of command, getting Dutch political
  leadership to make a decision that bypassed the frozen UNPROFOR hierarchy — was
  progressively paralyzed. When the crisis peaked on July 11–12, the gap between
  urgency and actionability was total. The structure had been designed for deterrence,
  not for the moment deterrence had failed.

# ── Conditions, capacity, constraints ────────────────────────────────────────

enabling_conditions: |
  The Dutch Defense Minister and NATO Secretary-General were reachable by direct
  communication. The NIOD report later confirmed that Dutch political leadership had
  limited situational awareness during the crisis — meaning the channel upward was
  not blocked, it was unused. Karremans had the authority to declare the mandate
  unworkable and seek political guidance; nothing in the operational framework
  prohibited him from escalating above UNPROFOR. He chose to work within the chain
  of command that had already failed him.

capacities: |
  Dutchbat could not stop the massacre militarily. It could refuse operational
  cooperation with the separation. It could position soldiers as documented witnesses.
  It could transmit a formal mandate failure declaration to Dutch political leadership
  in real time. It could demand, explicitly and on the record, that the compound
  perimeter be respected. None of these capacities required military force; all were
  within the unit's authority.

constraints: |
  The binding constraint was not military capacity but the operational framework itself:
  Dutchbat was structured to comply with the chain of command and to honor the mandate
  text, and no protocol existed for a field commander to declare the mandate incoherent
  in real time. The secondary constraint was troop safety: any refusal to cooperate
  risked Serb retaliation against Dutch soldiers, 27 of whom were already held as
  collateral in the Serb-controlled zone.

# ── Decision pathway ────────────────────────────────────────────────────────

decision_pathway: Reframe
tools:
  - "Mandate failure declaration → Karremans transmits a formal communication to Dutch
    Defense Minister and NATO Secretary-General directly, bypassing the UNPROFOR
    chain that was not functioning, declaring that the safe area mandate cannot be
    executed and that Dutchbat's only viable objective is evacuation and documentation
    → changes coordination: forces the political-level decision to be made at the
    political level, in real time, with the commander's assessment on the record"
  - "Compound perimeter witness protocol → Dutch soldiers positioned at the separation
    point as documented witnesses, with explicit orders to record everything and to
    neither facilitate nor resist the separation → changes learning: creates
    contemporaneous documentation under military command authority, establishing
    what the Dutch operational role was and was not"
  - "Non-cooperation posture at the gate → Dutch soldiers ordered not to assist in
    directing Bosnian men toward Serb vehicles, without using force → changes
    interaction: removes the operational complicity that made the Dutch presence
    useful to Mladic as diplomatic cover, even if it cannot stop the separation"

metrics:
  - "Escalation latency: hours elapsed between Karremans's knowledge of the mandate's
    failure and ministerial-level awareness in The Hague → method: communications logs
    → linked to mandate failure declaration"
  - "Documented complicity incidents: number of incidents in which Dutch soldiers
    actively facilitated the separation vs. the number in which they were positioned
    as passive witnesses → method: trial testimony and military logs → linked to
    witness protocol"
  - "Political decision lag: hours between the enclave's fall and a Dutch cabinet-level
    decision about Dutchbat's mandate → method: parliamentary records →
    linked to all three tools"

ninety_day_commitment: |
  Counterfactual pathway (from July 11, 1995): On the night of July 11, following the
  enclave's fall and the initial UNPROFOR refusal of air support, Karremans transmits
  a formal mandate failure declaration directly to Dutch Defense Minister Joris Voorhoeve,
  naming the specific incompatibility between the mandate's protection obligation and
  the force structure, and requesting emergency political authorization for either a
  revised mandate or an evacuation objective. On July 12, at the compound gate, Dutch
  soldiers are positioned as witnesses but not facilitators: they do not assist in
  directing men toward buses, do not separate women from men, do not clear the
  perimeter. This does not stop the separation; Serb forces proceed. But the Dutch
  operational role is documented differently. Simultaneously, Karremans requests that
  the 27 Dutch soldiers held by the Serbs be treated as the hostage-taking they are,
  triggering a NATO-level response that changes the political calculus of the
  air-strike authorization. Within 90 days — the timeline of the counterfactual —
  the Dayton negotiations proceed; the Dutch political investigation begins earlier,
  with contemporaneous documentation rather than reconstructed testimony.

# ── Stress test ──────────────────────────────────────────────────────────────

stress_test:
  political_derailment: |
    The Dutch Parliamentary election on July 14 meant that political leadership was
    in campaign mode, not crisis-management mode. A formal mandate failure declaration
    would have forced the election into the Srebrenica crisis in real time — a
    potentially destabilizing move for both the caretaker government and for the troops
    whose welfare was a visible campaign issue.
  institutional_block: |
    The dual-key NATO/UN authorization structure for air strikes had been functionally
    paralyzed since May 1995. Even with direct political escalation, Karremans could
    not guarantee that air strikes would be authorized within a militarily relevant
    timeframe. The institutional block was real, not merely procedural.
  wrong_assumption: |
    The assumption that Mladic would have accepted Dutch non-cooperation without
    escalating violence against Dutch soldiers themselves is not certain. The 27 Dutch
    soldiers held in Serb-controlled territory were a real vulnerability, and Mladic
    had demonstrated willingness to hold UN peacekeepers hostage.
  missing_resource: |
    A clear command protocol for a field commander to declare a UN mandate
    incoherent in real time. No such protocol existed. Karremans was operating in an
    institutional gap: his mandate told him to protect, his chain of command told him
    he had no force to use, and no procedure existed for declaring the contradiction.
  twelve_month_failure: |
    Even with all counterfactual actions taken — mandate failure declaration,
    non-cooperation posture, political escalation — the men outside the compound
    perimeter could not have been protected. The structural design failure of the safe
    area concept would not have been resolved by a battalion commander's refusal to
    cooperate at one gate. The men who sought refuge within the compound might have
    had different outcomes. The 8,373 who were taken from the surrounding hills and
    roads were outside any move available to Karremans.

revised_problem_definition: |
  The decision problem is not "how should Karremans operate within the mandate" but
  "at what moment does compliance with an incoherent mandate cross from adherence to
  complicity, and what is a commander's obligation at that crossing?" The stress test
  reveals that the counterfactual does not prevent the massacre — most of those killed
  were not within Dutchbat's operational reach. The revised problem is narrower and
  harder: it is about the commander's obligation to document non-complicity,
  to escalate outside a frozen chain of command, and to refuse operational assistance
  to an atrocity even when refusal does not prevent it. The flag is not that the right
  decision would have saved 8,373 lives. The flag is that the wrong decision made the
  UN presence an instrument of the atrocity rather than a witness to it.

# ── Honesty ──────────────────────────────────────────────────────────────────

flag: |
  Presence without protection: a UN mandate that creates a safe area designation without
  a commensurate force protection capability signals safety it cannot provide. The
  designation itself prevented the individual flight decisions that might have distributed
  40,000 people across terrain that was harder to control than a single enclave. Dutchbat's
  presence signaled to the world that Srebrenica was protected; Mladic's operation
  executed in the knowledge that the signal was false and that the Dutch command structure
  would not deviate from its mandate. Principled pragmatism can identify the 18th camel —
  declare the mandate incoherent, document non-complicity, escalate politically — but
  cannot resolve a mandate that was structurally incoherent at the design level, agreed
  by member states who never intended to back it with force. The problem was not solved
  at Potočari. It was created in New York.

