    decision process. Verified."
  - "MSF Nobel Peace Prize acceptance speech, Oslo, December 10, 1999. Full text available
    on Nobel Prize official website (nobelprize.org) and MSF website. Verified."
  - "David Rieff, 'A Bed for the Night: Humanitarianism in Crisis' (2002, Simon &
