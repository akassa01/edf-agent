  - "Rony Brauman and René Backmann, 'Les médias et l'humanitaire' (1996, CFPJ Editions).
    History of MSF's témoignage doctrine from the founding split. Verified."
  - "Human Rights Watch, 'Welcome to Hell: Arbitrary Detention, Torture, and Extortion
    in Chechnya' (October 2000). Conditions MSF was witnessing. Verified."
