# ── Three perspectives (all required) ────────────────────────────────────────

scientist: |
  The science is not contested: waste management alone cannot close the plastic pollution
  gap. UNEP's "Turning Off the Tap" report (2023) models that even full implementation of
  all proposed recycling improvements leaves 100 million metric tonnes of plastic entering
  the environment annually by 2040. A 40% reduction in primary production alongside
  ambitious recycling is what gets the system to plastic neutrality. Global plastic
  production currently runs at approximately 430 million metric tonnes per year (UNEP,
  2023); at the current 4% annual growth rate, it will exceed 1.1 billion tonnes by 2060.
  Only 9% of plastic ever produced has been recycled. The scientist sees: a scientifically
  clear case for production reduction being blocked not by countervailing scientific
  evidence but by economic and political interests that have found procedural shelter in
  the INC's consensus-based decision rule. At INC-5 in Busan (November–December 2024) and
  again at INC-5.2 in Geneva (August 2025), the scientific case was not refuted; it was
  outmaneuvered.

humanist: |
  Plastic production is not evenly distributed in its harms. Of the 430 million tonnes
  produced annually, more than two-thirds become short-lived products or packaging within
  months. The communities that absorb the waste — fisher communities in Southeast Asia,
  coastal populations in West Africa, informal waste workers across the Global South —
  did not design the production system and bear its costs without meaningful representation
  in the treaty negotiations. The contested value is not environmental vs. economic: it is
  about who is recognized as a stakeholder in a decision whose costs fall on people who
  are not at the table. The Like-Minded Group (led by Saudi Arabia, Russia, Iran, Kuwait,
  with China and India in loose alignment) frames production caps as an infringement on
  sovereign development rights. The High Ambition Coalition (HAC, co-chaired by Norway
  and Rwanda, 71 member states) frames them as an environmental justice obligation. Both
  framings have internal coherence. Neither, so far, has found a pathway to the other's
  interests.

engineer: |
  The INC process operates on a consensus decision rule — which, in practice, gives any
  compact bloc of states veto power over the treaty's ambition. At Busan and Geneva, a
  small group of oil-producing states used this rule to prevent any language binding
  plastic production from entering the treaty text. The engineer's reading: the
  doing-mode imperative was to "get a treaty," and the process optimized relentlessly
  toward that goal — producing text that both production-cap and waste-management-only
  positions could technically live with, and in doing so produced text adequate for
  neither. The engineer also sees what was not tried: the INC procedural rules allow for
  a vote under specified conditions; the INC Chair (Luis Vayas Valdivieso) did not invoke
  them at Busan. The engineer sees the NDC mechanism from the Paris Agreement — nationally
  determined contributions, reviewed and ratcheted — as an institutional template that
  decouples the question of "how much" from the question of "who is accountable for what,"
  and wonders why it was not put on the table.

archetype_dominant: scientist
crowded_out_mode: doing

# ── Diagnosis ────────────────────────────────────────────────────────────────

scientific_facts: |
  430 million tonnes/year global plastic production (UNEP, 2023). Only 9% ever recycled.
  UNEP modeling: waste management alone leaves 100 million tonnes/year in environment by
  2040; production reduction of 40% + ambitious recycling achieves plastic neutrality.
  Scientific consensus explicit: waste management alone is insufficient (UNEP "Turning
  Off the Tap," 2023). No peer-reviewed scientific evidence contradicts this.

social_facts: |
  Petrostates (Saudi Arabia, Russia, Iran, Kuwait, others) have direct economic interests
  in continued plastic production via petrochemical exports. Developing nations without
  petrochemical industries are split: many support production caps but need transition
  financing. HAC has 71 member states. Like-Minded Group is smaller but uses consensus
  rule to block progress. Communities most harmed by plastic pollution (fisher communities,
  coastal populations, informal waste workers) are not direct parties to negotiations.

political_realities: |
  INC consensus decision rule gives any blocking coalition veto power. INC Chair Vayas
  Valdivieso chose to adjourn Busan rather than invoke voting procedures, preserving the
  consensus norm but sacrificing treaty ambition. US position has historically been
  ambivalent: signed Paris Agreement but exited; ratification track for any plastics treaty
  is uncertain. The INC-5 Chair's Text preserved production cap language as an option but
  left the issue unresolved. INC-5.2 (Geneva, August 2025) and INC-5.3 (Geneva, February
  2026) also ended without final agreement. As of August 2026, no treaty has been adopted.

uncertainty_and_ambiguity: |
  Uncertainty: the optimal level of production reduction is modeled, not precisely known;
  the actual transition cost for petrochemical-dependent developing nations is contested.
  Ambiguity: "production" itself is undefined in the treaty context — is it crude oil,
  refined petrochemicals, plastic polymer pellets, or finished plastic products? Where in
  the supply chain does the obligation attach? This is not a communication failure; it is
  a genuine definitional question with significant distributional implications.

key_tensions:
  - Scientific sufficiency (production reduction required) vs. political achievability (consensus blocks production caps)
  - Development sovereignty (petrostate bloc) vs. environmental justice (high-ambition coalition + affected communities)
  - Process integrity (consensus rule as diplomatic norm) vs. outcome adequacy (what science requires)

problem_definition: |
  How should the INC process, as it moves toward a final agreement, secure binding plastic
  production reduction obligations when a blocking coalition of petrostates uses the
  consensus rule to prevent them, and when the high-ambition coalition's purely
  science-driven framing has so far failed to build the transition pathway that would
  bring developing nations firmly to its side?

# ── Metaphors ────────────────────────────────────────────────────────────────

one_plus_one: |
  The High Ambition Coalition was answering: "What does the science require to solve
  plastic pollution?" The Like-Minded Group was answering: "What protects our sovereign
  right to develop our petrochemical sectors?" Developing nations were answering: "What
  guarantees that we get transition financing if we accept production caps?" Three
  separate questions. 1+1+1 produced three separate draft treaty sections, none of which
  could be combined without someone losing what they came for.

where_is_x: |
  The INC-5 closing plenary in Busan, on the evening of December 1, 2024: the moment
  when Chair Vayas Valdivieso chose to adjourn rather than invoke the INC's procedural
  voting rules. This is the most precisely locatable fulcrum: the Chair had both the
  legal authority to call a vote (under the rules of procedure adopted from UNEA-5.2)
  and a political calculation that doing so would fracture the consensus process beyond
  repair. A second fulcrum, earlier in the negotiation: the moment when the HAC's lead
  delegations decided not to table a concrete transition-financing package alongside
  their production cap proposal — separating the "what" from the "how." The second
  intervention point was earlier and more leveraged.

eighteenth_camel: |
  The stated binary: (A) binding global production cap (opposed by petrostates, blocks
  consensus) or (B) waste management only without production obligations (opposed by
  HAC and scientifically inadequate). The 18th camel: a "national plastic production
  trajectories" mechanism, modeled on the NDC structure in the Paris Agreement. Each
  country submits a national plan specifying its plastic production levels and a
  technically justified reduction pathway tied to sustainable consumption benchmarks.
  Plans are subject to peer review by a UNEP-convened technical body. There is no agreed
  global production cap — only agreed reporting, review, and ratcheting obligations. This
  changes the structure of the problem: petrostates can participate without conceding a
  global cap; small island states and HAC members get binding transparency and
  accountability; developing nations get a structure that links plan ambition to
  transition finance eligibility. The NDC mechanism was not initially popular in Paris
  either.

solomon_check: |
  The HAC's lead delegations — EU, Norway, Rwanda — would, in another context (advising
  a country on how to negotiate a trade agreement where it holds less power than the
  opposing bloc), recommend building transition incentives for the fence-sitting middle
  group before demanding the headline obligation. They applied science-first rather than
  coalition-building-first to a consensus-rule body, and were surprised when the outcome
  matched the blocking coalition's interests rather than the evidence.

urgency_vs_actionability: |
  The urgency to get any treaty — as the INC's five-year mandate approached exhaustion —
  accelerated the schedule and compressed the space for creative procedural design. The
  faster the deadline pressed, the more the process optimized for text that could survive
  consensus, and the less time there was to design the institutional architecture (NDC-
  equivalent, financing facility, review mechanism) that would make production obligations
  real. Urgency produced a race to the bottom of ambition.

# ── Conditions, capacity, constraints ────────────────────────────────────────

enabling_conditions: |
  The Paris Agreement NDC mechanism provides a tested template that preserves national
  sovereignty while creating accountability. UNEP's "Turning Off the Tap" report provides
  the scientific roadmap. The HAC's 71-country membership gives it a genuine coalition
  majority. The INC procedural rules include voting provisions that could be invoked if the
  Chair and a qualified majority choose. These enabling conditions are present but none has
  been fully activated in combination.

capacities: |
  The INC Chair can call a vote and can produce a revised Chair's Text at any session.
  UNEP can convene an intersessional technical process. HAC member states can table a
  concrete financing package for developing nations. None of these requires treaty
  consensus — only the Chair's procedural authority and bilateral diplomatic work.

constraints: |
  Binding constraint: the INC's consensus norm — not a formal rule, but a diplomatic
  expectation strong enough that the Chair would not invoke voting procedures at Busan
  despite having the authority. Secondary constraint: the definitional ambiguity of
  "production" in the treaty's scope, which cannot be resolved without a political choice
  about where in the supply chain the obligation attaches — a choice that allocates
  economic costs between countries.

# ── Decision pathway ────────────────────────────────────────────────────────

decision_pathway: Redesign
tools:
  - "National Plastic Production Trajectory (NPPT) mechanism → each country submits a
    production plan with a reduction pathway, peer-reviewed by a UNEP technical body →
    creates accountability through transparency and ratcheting without requiring agreement
    on a global cap; changes the interaction structure from 'agree on a number' to 'justify
    your trajectory'"
  - "Transition Finance Eligibility Framework → links NPPT ambition level to automatic
    eligibility for multilateral transition financing → changes the incentive structure for
    developing nations from 'production caps threaten our industries' to 'ambitious plans
    unlock concessional capital'"
  - "Without-prejudice definitional protocol → at the next INC session, a technical working
    group convened by UNEP to formally define 'plastic production' in the treaty's scope,
    producing three defined options (resin-level, pellet-level, product-level) with explicit
    distributional implications for each → changes the epistemic architecture by separating
    the technical definition question from the political allocation question"

metrics:
  - "NPPT coverage: % of global plastic production covered by submitted national trajectory
    plans → measure via UNEP Secretariat registry → linked to NPPT mechanism"
  - "Transition finance activation: USD disbursed under the Transition Finance Eligibility
    Framework within 24 months of treaty adoption → measure via multilateral development
    bank reporting → linked to finance mechanism"
  - "Definitional clarity: whether a legally agreed definition of 'plastic production' for
    treaty purposes is adopted at the next INC session → measure via treaty text → linked
    to without-prejudice definitional protocol"

ninety_day_commitment: |
  Live recommendation: the INC Secretariat convenes an intersessional technical working
  group (UNEP-hosted, 15-member, 3 from Like-Minded Group, 5 from HAC, 7 from developing
  nations without large petrochemical sectors) to produce a draft NPPT mechanism design
  with three structural options for member state review. Simultaneously, the HAC's core
  members (Norway, Rwanda, EU) propose a concrete transition finance facility (initial
  capitalization: $5 billion over 5 years from OECD donors) and publish eligibility
  criteria tied to NPPT ambition level. Both outputs are tabled for the next INC session
  before the agenda is finalized.

# ── Stress test ──────────────────────────────────────────────────────────────

stress_test:
  political_derailment: |
    If the US changes its negotiating position (as it did under both the Obama-to-Trump
    and Biden-to-Trump transitions), it could either abandon the treaty process entirely
    or align with the Like-Minded Group, dramatically weakening HAC coalition leverage.
    The NPPT mechanism requires US domestic ratification for US production to be covered.
  institutional_block: |
    The petrostates' Like-Minded Group has signaled it will walk out of any process that
    uses voting procedures rather than consensus. A vote-based adoption of the NPPT
    mechanism — even if procedurally valid — could produce a treaty that major
    petrochemical producers decline to ratify, reducing coverage of global production.
  wrong_assumption: |
    The Paris NDC analogy assumes that transparency and ratcheting mechanisms produce
    real behavior change even without binding global caps. The evidence from the Paris
    process is mixed — NDC ambition has not been sufficient to meet 1.5°C targets. The
    NPPT mechanism may reproduce this dynamic for plastics: formal commitment without
    adequate outcome.
  missing_resource: |
    A $5 billion transition finance facility is a small fraction of the capital that
    would be required for petrochemical-dependent developing nations to reorient their
    industrial sectors. Without a credible financing architecture at scale, the finance
    incentive mechanism does not move middle-group developing nations toward the HAC
    position.
  twelve_month_failure: |
    If the next INC session is convened without an intersessional NPPT design process,
    delegations will again arrive with maximalist positions and no intermediate
    institutional option. The consensus rule, the Like-Minded Group's blocking capacity,
    and the HAC's science-first framing will reproduce the Busan and Geneva dynamics.

revised_problem_definition: |
  The problem is not only "how do we get production caps into the treaty" but "how do we
  redesign the negotiating architecture itself — the consensus rule, the definition of
  production, the link between ambition and financing — so that the petrostates' blocking
  capacity is no longer structurally determinative?" The stress test reveals that the NPPT
  mechanism is a genuine 18th camel but requires two prior institutional acts (technical
  definition working group and transition finance facility) before it can work, and that
  neither act is currently tabled. The real binding constraint is not the petrostates'
  opposition per se — it is the HAC's failure to design and offer the institutional pathway
  that would make the petrostate bloc's opposition politically costly to their allies.

# ── Honesty ──────────────────────────────────────────────────────────────────

flag: |
  The treaty text will eventually contain a definition of "plastic production" — and that
  definitional choice is the treaty's most consequential and least-discussed design
  decision. Accountability for plastic pollution attaches to whoever is defined as the
  "producer": crude oil exporters, resin manufacturers, pellet producers, or consumer-
  product companies. Each definition allocates the economic burden of compliance to a
  different set of countries and industries. Principled pragmatism can map the options
  and specify the distributional consequences of each. It cannot resolve which distribution
  is just — because the distributional question is the policy question, and the treaty
  cannot be designed around it without making a political choice that scientific analysis
  alone cannot provide. The 18th camel (NPPT mechanism) defers this choice by creating
  a framework for transparency before the definition is locked. But deferred is not resolved.

