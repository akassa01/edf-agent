## Identity
case_id: arctic-council-raipon-denmark-2026
title: "Who Speaks for Russia's Arctic Peoples"
case_type: documented
mode: prospective
scale: international
region: "Arctic (Russia; Kingdom of Denmark/Greenland as chair; Tromsø, Norway — Secretariat; six Permanent Participant territories spanning Alaska, Canada, Greenland, Norway, Sweden, Finland, Russia)"
recency: recent
