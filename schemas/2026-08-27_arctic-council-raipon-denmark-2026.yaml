rubric_version: 1

## The three perspectives
scientist: >
  Russia holds the world's largest expanse of Arctic territory — 53% of the Arctic
  coastline — and controls the Siberian permafrost monitoring network. That permafrost
  stores vast quantities of carbon; its thaw accelerates warming at a rate that cannot
  be adequately modeled without ground-based monitoring data from Siberia. By January
  2024, researchers at Aarhus University were warning that missing Russian data was
  causing "Arctic climate blind spots" that "decrease our ability to accurately describe
  Arctic changes." The AMAP Working Group's Arctic Climate Change Update 2024 was produced
  with acknowledged geographic gaps in monitoring coverage. Separately, in August 2026,
  NOAA ended administrative support for the Arctic Report Card — published annually since
  2006 — further eroding the scientific infrastructure for communicating Arctic change.
  The scientist identifies two simultaneous data crises, neither politically caused, both
  politically enabled: Russia's scientific isolation and the US's administrative withdrawal.

humanist: >
  Six organizations representing Arctic indigenous peoples have Permanent Participant
  status in the Arctic Council: the Aleut International Association, Arctic Athabaskan
  Council, Gwich'in Council International, Inuit Circumpolar Council, Russian Association
  of Indigenous Peoples of the North (RAIPON), and the Saami Council. Of these, RAIPON
  is unique: it was captured by Kremlin-aligned actors in 2013, has since been controlled
  by leadership loyal to Moscow, and in 2022 issued a statement supporting Russia's
  invasion of Ukraine — a statement that the peoples it is supposed to represent had no
  role in crafting. Russian Arctic indigenous groups in exile — Nenets, Khanty, Even, and
  others driven out of Russia by political repression — exist and wish to participate in
  Arctic governance, but are not invited. The humanist sees a profound structural injustice:
  the people most directly exposed to Arctic environmental change in Russia have no
  authentic voice in the institution built to respond to it. Their seat is occupied by a
  Kremlin ventriloquist.

engineer: >
  Denmark's 2025-2027 chairmanship program states a commitment to "strengthen the
  participation of Indigenous Peoples." The engineer asks what this means in practice,
  given that: (a) the Arctic Council's founding Ottawa Declaration (1996) requires
  consensus among all eight member states and six Permanent Participants to change any
  institutional rule; (b) any formal change to RAIPON's status requires Russia's agreement,
  which will not be given; (c) the "invited expert" mechanism that working groups use to
  bring in non-member scientific expertise is already available and could accommodate
  Russian indigenous scientists on a personal capacity basis; (d) no member state has
  formally tabled a proposal to address RAIPON's captured status. The governance machinery
  exists to partially fix the problem. The institutional culture has avoided using it.

archetype_dominant: humanist
crowded_out_mode: thinking (the strategic question of what authentic Arctic indigenous
  governance looks like over a 30-year climate emergency has been crowded out by the
  moral solidarity response to Russia's invasion — the feeling that cooperating with
  RAIPON is complicity in the war has foreclosed thinking about what comes after RAIPON)

## Diagnosis of the problem space
scientific_facts: >
  - Russia holds 53% of Arctic coastline; Siberian permafrost monitoring stations are
    the largest single terrestrial carbon store monitoring network in the world.
  - As of January 2024, Siberian permafrost data is effectively inaccessible to
    international researchers; AMAP 2024 climate assessment documents geographic gaps.
  - Approximately half of INTERACT (International Network for Terrestrial Research and
    Monitoring in the Arctic) stations are located in Russia; their data is excluded.
  - NOAA ended administrative support for the Arctic Report Card in August 2026.
  - The US objected to "climate change" language in the May 2025 Romssa-Tromsø Statement.
  - Working group meetings resumed in virtual format with all eight states in February
    2024; Russia participates, giving it agenda influence in technical deliberations.

social_facts: >
  - RAIPON's organizational independence was lost in 2013 when Kremlin-aligned actors
    took over its board.
  - In 2022, RAIPON issued a public statement of support for Russia's invasion of Ukraine
    without consulting the 40 indigenous peoples' groups it nominally represents.
  - Russian Arctic indigenous groups operating in exile exist and have sought participation
    in Arctic Council activities; Norway's foreign minister stated in May 2025 that exiled
    representatives "can apply and register" for meetings but no formal mechanism exists.
  - Denmark's 2025-2027 chairship program commits to "strengthening Indigenous Peoples'
    participation" but does not address the RAIPON legitimacy question.
  - In July 2024, Russia's Ministry of Justice declared dozens of independent Arctic
    indigenous organizations as extremist, further suppressing authentic indigenous voice.

political_realities: >
  - Russia participates in virtual working group meetings since February 2024; it retains
    consensus power within the Council's formal structure.
  - Russia suspended financial contributions to the Arctic Council Secretariat in February
    2024, tying payment resumption to "full-fledged work and interaction between all members."
  - No mechanism exists in the Ottawa Declaration (1996) to suspend a Permanent Participant
    whose organizational independence has been compromised by state capture.
  - The US under the Trump administration (2025–) objected to climate language at the
    14th Ministerial and ended NOAA Arctic Report Card support — reducing US scientific
    leadership in the Council simultaneously with Russia's political exclusion.
  - Denmark's Greenlandic representation (Foreign Minister Vivian Motzfeldt; Senior Arctic
    Official Kenneth Høegh) gives the chairship an authentic indigenous leadership voice
    that is symbolically important but does not resolve the RAIPON structural problem.

uncertainty_and_ambiguity: >
  Uncertainty: Would Russia withdraw entirely from the Arctic Council if Denmark proposed
  any formal mechanism to accommodate exiled indigenous voices? Unknown; Russia has
  participated in virtual working groups since 2024 despite the ongoing suspension.
  Ambiguity: "Strengthening Indigenous Peoples' participation" means different things:
  for Denmark, better process inclusion of the existing six Permanent Participants;
  for exiled Russian indigenous groups, formal recognition outside RAIPON; for Russia,
  any change to Permanent Participant representation is a political provocation.

key_tensions:
  - "RAIPON legitimacy vs. institutional stability: challenging RAIPON's captured status
    risks Russia's withdrawal from the Council, eliminating even the minimal cooperation
    that virtual working group meetings provide."
  - "Scientific imperative vs. political solidarity: Arctic climate science requires
    Russian data; political solidarity with Ukraine requires limiting Russian participation;
    the two imperatives are in direct conflict."
  - "Indigenous rights vs. consensus governance: the Ottawa Declaration gives indigenous
    Permanent Participants unique standing, but that standing is mediated through
    organizations that can be captured by states — the mechanism intended to protect
    indigenous voice can be converted into a tool of its suppression."

problem_definition: >
  Should Denmark's 2025-2027 Arctic Council chairmanship establish a formal mechanism for
  authentic Russian Arctic indigenous participation outside the RAIPON framework — knowing
  that any such mechanism requires consensus (impossible without Russia) or a creative use
  of existing technical participation rules that Russia may contest?

## The metaphors
one_plus_one: >
  Denmark asks: "How do we strengthen Indigenous Peoples' participation in the Arctic
  Council?" Russia's Permanent Participant RAIPON answers: "We are already here; our
  Permanent Participant status is established." Exiled Russian indigenous groups answer:
  "We are not here, and the organization in our seat does not represent us." All three
  are answering different questions about who already occupies the seat. 1+1 produced
  three separate ones.

where_is_x: >
  The Senior Arctic Officials meeting under Denmark's chairmanship in 2025-2026 — the
  meeting where Denmark must decide whether to table any proposal addressing the RAIPON
  legitimacy question. By not tabling a proposal, Denmark implicitly extends the status
  quo for two more years. The intervention point is not the Permanent Participant structure
  itself (which requires consensus to change) but the "invited expert" mechanism that
  working groups already use: Denmark's chairship can issue standing guidance that working
  group chairs should routinely invite scientific experts from Russian indigenous communities
  on a personal capacity basis, normalizing their participation without requiring formal
  rule changes. This is the most precisely located leverage point available to the chair.

eighteenth_camel: >
  Not formal recognition of exiled organizations (which requires consensus, hence Russia's
  veto). Not maintaining the RAIPON status quo (which makes Denmark's indigenous
  commitments hollow). The third option: a "Scientific Heritage Protocol" — Denmark issues
  chairmanship guidance that Arctic Council working groups will treat contributions from
  Arctic indigenous knowledge holders, including those from Russia, as "traditional
  ecological knowledge (TEK) submissions" in their personal scientific capacity, regardless
  of organizational affiliation. Data and knowledge contributed this way is labeled as
  "expert contribution to Arctic scientific heritage" rather than a RAIPON submission.
  This decouples scientific/knowledge contribution from political representation, using
  an existing mechanism (working group expert contributions) in a new way. RAIPON retains
  its formal seat; Russian experts from exile communities contribute scientific knowledge
  through a technical channel that Russia cannot formally veto without also blocking
  Russia's own working group participation.

solomon_check: >
  The seven Arctic states, advising any other multilateral institution whose Permanent
  Participant or member organization had been demonstrably captured by a state government,
  would immediately identify two things: (a) the legitimacy problem is real and must be
  named, and (b) formal rule change is blocked, so creative use of existing technical
  mechanisms is the only available pathway. The wisdom is available in the abstract; the
  political proximity to Russia's war — the solidarity with Ukraine that makes any
  engagement with Russian institutions feel like complicity — forecloses inward application.

urgency_vs_actionability: >
  Arctic climate change is accelerating. The window for meaningful intervention in the
  carbon feedback loops that Siberian permafrost governs is measured in years to decades.
  The governance capacity needed to address this — full-spectrum, authentic Arctic
  environmental monitoring including Russian data — requires institutional trust that
  takes years to rebuild. The urgency of climate response escalates faster than the
  capacity to repair the governance fracture. Each year of RAIPON's continued empty
  representation extends the period during which Russian indigenous TEK is unavailable
  to Arctic science.

## Conditions, capacity, constraints
enabling_conditions: >
  - Denmark's chairship has authentic Greenlandic indigenous leadership (Motzfeldt,
    Høegh) that gives its indigenous-participation commitments moral credibility.
  - Working groups already have "invited expert" mechanisms that function without formal
    consensus changes.
  - Norway's May 2025 statement that exiled Russian indigenous representatives can "apply
    and register" establishes a precedent that individual participation is legally permitted.
  - The Romssa-Tromsø Statement (May 2025) was signed by all eight states and six
    Permanent Participants, reaffirming the Council's mandate.

capacities: >
  - Denmark's chairship can issue working group guidance without formal rule changes.
  - Denmark can convene informal side events that include exiled Russian indigenous voices
    without triggering formal consensus requirements.
  - The chairship controls the agenda for Senior Arctic Officials meetings and can frame
    the RAIPON question as a technical governance matter rather than a political one.

constraints: >
  - Binding constraint: the consensus requirement in the Ottawa Declaration. Any formal
    change to RAIPON's status requires Russia's agreement.
  - Secondary constraint: the risk that Russia treats any new mechanism as grounds to
    withdraw from virtual working group meetings (its current minimal participation),
    further reducing scientific data access.
  - Time: Denmark's chairship ends in 2027; if no action is taken by mid-2026, the
    window for the current term closes.

## Decision pathway
decision_pathway: Reframe
tools:
  - "Working group expert guidance → purpose: normalize participation by Russian indigenous
    knowledge holders in personal scientific capacity → how it changes interaction: creates
    a formal channel for Russian indigenous TEK that bypasses RAIPON without requiring
    Russia's permission, making the knowledge flow between Russian indigenous communities
    and Arctic science a technical matter rather than a political one."
  - "Arctic indigenous knowledge registry → purpose: document TEK contributed by
    indigenous communities across all eight states, including Russia, as a scientific
    heritage asset → how it changes learning: builds an institutional record that persists
    beyond any single chairship, creating a baseline for future governance frameworks that
    acknowledge Russian indigenous knowledge even if formal participation remains blocked."
  - "Chairship side-event series → purpose: convene Russian Arctic indigenous communities
    in exile alongside non-Russian indigenous Permanent Participants for informal
    knowledge-sharing → how it changes coordination: builds relationships and data-sharing
    protocols outside the formal structure, so that when formal structure eventually changes,
    the cooperation infrastructure already exists."

metrics:
  - "TEK contribution rate → measure: number of knowledge contributions from Russian
    Arctic indigenous experts (in personal capacity) to AMAP and other working group
    outputs → method: working group secretariat tracking, reported annually."
  - "Exiled community contact rate → measure: number of Russian indigenous communities
    in exile with active, documented data-sharing arrangements with Arctic Council working
    groups → method: chairship secretariat review."

ninety_day_commitment: >
  Prospective (live recommendation): Within 90 days of Denmark's first Senior Arctic
  Officials meeting, the chairship issues guidance to all six Arctic Council working
  group chairs specifying that contributions from "indigenous knowledge holders
  participating in their personal scientific capacity" are welcome through existing
  invited-expert mechanisms, and that such contributions will be labeled as "traditional
  ecological knowledge submitted to the Arctic scientific heritage" rather than as
  organizational submissions. Denmark simultaneously convenes an informal consultation
  with representatives of Russian Arctic indigenous communities in exile to document
  what knowledge they can contribute and to establish individual-level contacts with
  relevant working group projects.

## Stress test and refinement
stress_test:
  political_derailment: >
    Russia treats the "Scientific Heritage Protocol" as a de facto endorsement of exiled
    organizations, withdraws from virtual working group meetings entirely, and suspends
    all formal engagement with the Council — citing the chairship's guidance as evidence
    of political bias. Russia's remaining scientific contributions (even minimal, as reported
    through RAIPON in working group formats) become unavailable.
  institutional_block: >
    RAIPON formally objects to the working group guidance as a challenge to its Permanent
    Participant status, galvanizing Russia to issue a legal memorandum arguing the guidance
    violates the Ottawa Declaration. The legal uncertainty paralyzes working group chairs
    who are risk-averse about implementing the protocol.
  wrong_assumption: >
    The assumption that exiled Russian indigenous groups are numerous, organized, and
    capable of immediately contributing scientific knowledge may be wrong. Many may be
    dispersed, without institutional infrastructure, and focused on political survival
    rather than scientific contribution. The "invited expert" channel may create an
    expectation that cannot be filled in the short term.
  missing_resource: >
    Financial support for exiled Russian indigenous organizations to participate in Arctic
    Council activities. They lack the secretariat support, travel budgets, and institutional
    capacity that established Permanent Participants have. Without targeted funding from
    sympathetic member states, the protocol creates a formal channel that no one can
    afford to use.
  twelve_month_failure: >
    Russia uses its participation in virtual working group meetings to formally block
    any AMAP output that cites TEK contributions from exiled Russian indigenous sources —
    citing them as politically motivated misrepresentations of Russian indigenous peoples'
    views. Working group chairs, unwilling to publish outputs Russia has formally objected
    to, quietly drop the exiled contributions from the final documents.

revised_problem_definition: >
  The problem is not RAIPON's captured status — that is a symptom. The problem is that
  the Arctic Council's founding consensus architecture, designed for a world of eight
  cooperating states, has no mechanism for adjudicating when a Permanent Participant
  organization no longer represents its constituency, and provides no recourse short of
  either ignoring the problem or triggering institutional collapse. Denmark cannot fix
  this within its two-year chairship. What it can do is begin building the parallel
  infrastructure — knowledge registries, expert-participation channels, informal
  relationships — that a future governance reform would need to function. The stress test
  reveals that the 18th camel (Scientific Heritage Protocol) is not a solution to the
  governance problem; it is a bridge over it. The question for Denmark is whether to
  build the bridge while waiting for conditions that permit a permanent structure.

## Honesty
flag: >
  International institutions designed for cooperation between sovereign states cannot
  adjudicate the internal capture of civil society organizations that those institutions
  granted standing to. The Arctic Council's Permanent Participant structure assumed
  that indigenous organizations would remain genuinely independent from states; when they
  do not, the institution has no mechanism to correct this without the consent of the
  capturing state. Principled pragmatism can redesign the bridge; it cannot rebuild the
  river.

