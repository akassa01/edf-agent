# ── Diagnosis ────────────────────────────────────────────────────────────────

scientific_facts: |
  Death toll estimated between 3,800 (Union Carbide claim, 1989) and 25,000+ long-term
  (Amnesty International, 2004). ICMR studies ongoing and incomplete at settlement date.
  Methyl isocyanate effects on chronic exposure unknown in existing literature. Settlement
  amount calculated on contested baseline figures. No adjustment mechanism in settlement text.

social_facts: |
  Survivor organizations (Bhopal Gas Peedit Mahila Udyog Sangathan, others) were not
  parties to the government-Union Carbide negotiation. For survivors, money conflated civil
  compensation with criminal accountability. Community understanding of the settlement was
  that it amounted to exoneration of Union Carbide. The Central government, as plaintiff,
  had both the authority to negotiate and a political interest in closing an international
  embarrassment — interests not identical to survivors'.

political_realities: |
  The Indian government (Rajiv Gandhi administration, 1989) wanted the international
  embarrassment resolved before elections. Union Carbide's U.S. parent needed finality
  for corporate planning. Chief Justice Ranganath Misra presided over a Supreme Court
  process that moved quickly, in camera, without a formal public consultation period.
  Warren Anderson was in the US and protected by the absence of an extradition treaty
  covering the specific charges. The US legal environment made personal criminal liability
  for corporate officers in overseas disasters structurally inaccessible.

uncertainty_and_ambiguity: |
  Uncertainty: the full health toll was genuinely unknown in 1989; the settlement could
  have been adequate or grossly inadequate depending on ICMR data not yet in hand.
  Ambiguity: "justice" meant different things — to the Indian government (international
  closure), to Union Carbide (finality), to survivors (criminal accountability and medical
  recognition), to lawyers (precedent for multinational tort liability). These were not
  communication failures; they were genuinely incompatible definitions of what the case was about.

key_tensions:
  - Criminal accountability vs. immediate medical care for the living
  - Survivors' moral authority vs. their legal standing (as nonparties to the government case)
  - Justice for the dead vs. infrastructure for the living

problem_definition: |
  Should the survivor community accept a civil settlement that provides immediate medical
  funding but forecloses criminal accountability for the world's worst industrial disaster,
  when the criminal track is structurally inaccessible regardless of the settlement's terms?

# ── Metaphors ────────────────────────────────────────────────────────────────

one_plus_one: |
  The Indian government was answering: "How do we close this diplomatically without
  destroying India's investment environment?" Union Carbide was answering: "How do we
  achieve finality and limit aggregate liability?" Survivor organizations were answering:
  "How do we hold the corporation and its officers criminally accountable for mass death
  and ensure that survivors get actual medical care?" Three separate questions. 1+1+1
  produced three separate settlements, only one of which was legally binding.

where_is_x: |
  The Supreme Court hearing of February 14–15, 1989. Chief Justice R.S. Pathak's
  decision to proceed to settlement approval without a formal consultation period for
  survivor organizations was the specific fulcrum. The settlement also quashed all
  criminal proceedings — a provision the same Court struck down in October 1991 on
  review, at survivor organizations' petition. The leverage point was not the amount
  but the procedural moment that locked the settlement's structure (civil AND criminal
  quashing bundled together) before survivors could formally contest it.

eighteenth_camel: |
  The stated binary: (A) accept the $470M settlement as written — bundling civil
  compensation with criminal quashing — or (B) reject it entirely and fight on without
  medical funding flowing. The 18th camel: decouple the settlement's two components.
  Accept the civil funds for medical infrastructure, while the government's Attorney
  General formally refuses the criminal quashing clause — issuing a legal declaration
  that the settlement covers civil liability only and that criminal proceedings against
  Warren Anderson remain active under Indian law. The Supreme Court's own October 1991
  ruling, which struck down the criminal quashing on review at survivor petition, proves
  this separation was legally achievable. The government had the standing to demand it
  in February 1989; it did not. This is not a compromise between A and B: it changes
  the structure of what is on the table.

solomon_check: |
  Indian Supreme Court justices advising another country's court on a post-industrial-
  disaster settlement would have recommended: structured consultation with affected
  communities as legal parties, explicit civil/criminal severability, and a baseline health
  assessment before settlement quantification. They did not direct this wisdom inward — the
  pressure to close the case was too proximate.

urgency_vs_actionability: |
  Five years of international litigation, diplomatic embarrassment, and internal political
  pressure had created an urgency to settle that outpaced the capacity of survivor
  organizations — small, under-resourced, and lacking formal legal standing in the
  government case — to mount a procedural challenge. The faster the court moved, the less
  time there was to build the institutional challenge. Urgency was the settlement's most
  important structural feature.

# ── Conditions, capacity, constraints ────────────────────────────────────────

enabling_conditions: |
  Indian constitutional law includes robust public interest litigation standing that
  survivor groups could have used to intervene. The ICMR study infrastructure existed
  and was producing data. The International Campaign for Justice in Bhopal was forming
  as an international network and would, within years, develop the lobbying capacity
  to keep Anderson's arrest warrant active. These enabling conditions were present but
  not yet organized at the moment of settlement.

capacities: |
  The Indian government could negotiate, settle, and extinguish civil liability. It could
  not extradite Anderson. Survivor organizations could protest, publicize, and file
  public interest petitions, but lacked the legal standing to block a settlement concluded
  by the government as plaintiff. Chief Justice Misra had the authority to order a
  consultation period; he did not exercise it.

constraints: |
  Binding constraint: survivor organizations had no formal standing in the government case
  and could not procedurally block settlement approval, only contest it afterward. Secondary
  constraint: the extradition architecture meant criminal accountability for Anderson was
  structurally unavailable regardless of civil settlement terms.

# ── Decision pathway ────────────────────────────────────────────────────────

decision_pathway: Reframe
tools:
  - "Civil/criminal severability clause → explicitly preserved criminal proceedings as a
    separate active legal track, unaffected by any civil settlement → changes the legal
    architecture so survivors do not have to choose between medical funding and criminal
    accountability"
  - "Structured survivor consultation → survivor organizations given 90 days as formal
    intervenors before settlement approval → changes the epistemic and political authority
    structure of the negotiation"
  - "Health baseline commission → ICMR + survivor health advocates establish a joint
    baseline before settlement quantification → changes the evidentiary foundation of the
    settlement amount and creates an adjustment mechanism"

metrics:
  - "Criminal track status: whether Indian criminal case against Anderson remains
    procedurally active post-settlement → measure via Indian Supreme Court docket → linked
    to civil/criminal severability"
  - "Medical infrastructure deployment: clinics, rehabilitation centers, and vocational
    programs opened within 36 months of settlement → measure via Madhya Pradesh Health
    Ministry reports → linked to early and ringfenced distribution of settlement funds"
  - "Survivor organization representation: whether survivor groups participate as formal
    intervenors in settlement approval hearing → measure via Supreme Court case record →
    linked to consultation process"

ninety_day_commitment: |
  Counterfactual: by late 1985 (18 months after the disaster), the Indian government's
  Attorney General convenes a joint health baseline commission (ICMR + survivor-designated
  epidemiologists) and publicly states that any civil settlement will explicitly preserve
  criminal proceedings as a separate track. Survivor organizations are given formal
  intervenor status in the government's case. In 90 days, the health baseline commission
  produces an interim report establishing minimum health-toll estimates that floor the
  settlement figure and require an adjustment mechanism tied to ICMR's longitudinal studies.

# ── Stress test ──────────────────────────────────────────────────────────────

stress_test:
  political_derailment: |
    Union Carbide would refuse any settlement containing an explicit civil/criminal
    severability declaration — it would eliminate finality, which was Union Carbide's
    primary interest in settling. The Indian government, under political pressure to close
    the case, might abandon the severability language rather than lose the settlement entirely.
  institutional_block: |
    US extradition architecture means that even a preserved criminal track does not produce
    Anderson in an Indian courtroom. The Indian Supreme Court's warrant remains unenforceable
    regardless of what the civil settlement says. The criminal track is preserved symbolically
    and legally; its practical significance is near zero.
  wrong_assumption: |
    The assumption that survivor organizations could have mounted an effective procedural
    intervention within the Supreme Court's fast-track process was possibly wrong. Their
    organizations in 1989 were small and under-resourced; the International Campaign for
    Justice in Bhopal did not yet have the international network needed to apply effective
    diplomatic pressure on the timeline.
  missing_resource: |
    Survivor organizations lacked both legal standing as formal parties to the government
    case and the financial resources to hire senior advocates for a Supreme Court challenge
    on compressed timelines. The asymmetry between government/corporate legal resources and
    survivor organization capacity was not bridgeable without external legal aid infrastructure
    that did not exist in Bhopal in 1989.
  twelve_month_failure: |
    If the Indian government and Union Carbide both want the settlement closed — as they did —
    no consultation process imposed by a court survives their combined political and legal
    pressure to proceed. The 18th camel requires the Indian government to be genuinely
    committed to the civil/criminal severability principle, which requires a political will
    that the Rajiv Gandhi administration did not demonstrate.

revised_problem_definition: |
  The decision problem was not "accept or reject the settlement" but: how can a survivor
  community lacking formal legal standing ensure that any settlement preserves three distinct
  interests — medical care, criminal accountability, and participatory dignity — when the
  most important interest (criminal accountability via extradition) is structurally inaccessible
  regardless of what the settlement says, and when the community's leverage to affect the
  settlement's terms depends on an institutional capacity it has not yet built? The stress
  test reveals that the 18th camel's criminal track was achievable on paper and unenforceable
  in practice — which means the real problem the survivor community faced was how to maintain
  the moral and legal argument for accountability after the civil mechanism had closed without
  resolving it.

# ── Honesty ──────────────────────────────────────────────────────────────────

flag: |
  When a corporation can locate its senior officers in a jurisdiction that will not
  extradite them for corporate manslaughter, criminal accountability becomes performative
  regardless of how well the civil settlement is designed. The Indian Supreme Court could
  issue warrants for Warren Anderson; US courts would not compel his appearance. Principled
  pragmatism can design the civil/criminal severability mechanism; it cannot create
  jurisdictional authority that international corporate law in 1989 did not provide.
  The gap between the framework's prescription and the law's reach was not a failure of
  negotiation. It was the structure of the world as it was.

