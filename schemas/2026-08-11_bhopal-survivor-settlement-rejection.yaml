# ── Three perspectives (all required) ────────────────────────────────────────

scientist: |
  The epidemiological record of the Bhopal disaster was, by 1989, already internally
  contested. Union Carbide's legal filings claimed approximately 3,800 deaths; the
  Government of Madhya Pradesh registered 5,295; the Indian Council of Medical Research
  (ICMR) studies were ongoing and not yet published. Amnesty International would later
  document 22,000–25,000 excess deaths over the following two decades. The $470 million
  settlement figure ($US) was calculated on Union Carbide's lower estimates, not on
  ICMR data. The gas — methyl isocyanate (MIC) — was incompletely understood in terms
  of long-term chronic exposure effects: pulmonary fibrosis, reproductive harm, and
  neurological damage were being documented in real time with no prior industrial
  exposure literature to draw on. What the scientist sees: a settlement amount set before
  the full epidemiological toll was known, on disputed baseline numbers, with no mechanism
  for adjustment if the toll proved larger. The scientific uncertainty was not a failure
  of data collection; it was an inherent property of a disaster without precedent.

humanist: |
  For the survivors of the Bhopal Gas Tragedy, the ₹715 crore (approximately $470 million)
  settlement amounted to roughly ₹25,000 per claimant — approximately $300 at the time.
  The contested value was not the money. It was whether money was morally acceptable as a
  substitute for criminal accountability. The Bhopal Gas Peedit Mahila Udyog Sangathan
  (Women Workers' Union) and the Bhopal Gas Peedit Mahila Stationery Karmchari Sangh
  had not been made party to the negotiations between the Indian government and Union
  Carbide — negotiations conducted by lawyers in courtrooms in New York and New Delhi,
  without the people most affected ever speaking. For survivors, accepting the settlement
  meant accepting a legal fiction: that ₹25,000 was the value of a family member who had
  died of chemical poisoning because a corporation's safety systems failed. The contest was
  not about the amount. It was about whether any amount could close what the disaster had
  opened.

engineer: |
  The practical question — the one that the doing mode asked — was what the settlement
  money could actually accomplish for living survivors. The Bhopal Medical Appeal and the
  International Campaign for Justice in Bhopal later documented that adequate medical
  infrastructure for long-term chemical exposure effects was not established in Bhopal
  for decades after the disaster. Respiratory clinics, rehabilitation centers, and
  vocational retraining programs for the disabled were funded piecemeal, late, and
  inadequately. The engineer's reading: the $470 million, distributed early and well,
  could have funded exactly that infrastructure. The legal dispute over the settlement's
  adequacy — the survivor groups' sustained argument that it was too little — effectively
  froze the money's deployment in litigation and appeal while survivors died untreated.
  The engineer also sees the parallel track: the criminal case against Warren Anderson
  (Union Carbide CEO, arrested in Bhopal in December 1984, released, and never returned)
  was structurally inaccessible regardless of the civil settlement's outcome. US courts
  would not extradite him; this was not a question of negotiation tactics but of treaty
  architecture.

