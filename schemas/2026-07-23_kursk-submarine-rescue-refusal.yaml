# --- THREE PERSPECTIVES (all three required before prose) ---

scientist: |
  The technical facts were clear within 48 hours of the August 12 sinking. The Russian
  AS-34 rescue submarine had attempted to mate with the Kursk's escape hatch nine times and
  failed on each attempt; the hatch's seal was damaged and a pressure differential between
  the vessel's aft section and the rescue vehicle prevented successful docking. The Russian
  Navy's own engineers knew their assets were not equal to the task. Norwegian rescue
  technology — specifically the LR5 rescue vehicle and specialized commercial divers trained
  in North Sea oil rig emergency operations — had the tools and training to equalize
  pressure differentials and open recalcitrant hatches. The Norwegian team's track record
  in similar operations was documented. A comparative capability analysis, conducted
  empirically and honestly, would have reached a clear conclusion: Norwegian divers would
  succeed where Russian assets were failing. The survival window in compartment 9 was finite
  and measurable: the oxygen supply aboard the Kursk could sustain survivors for roughly
  three to seven days from the time of the sinking, depending on the number of survivors
  and the rate of consumption. The science said: act now, call Norway. The operational
  doctrine said otherwise.

humanist: |
  In Vidyayevo, the small military town near the Kola Peninsula where most of the Kursk's
  crew had families, wives and mothers were watching Russian television report that rescue
  was proceeding normally. In St. Petersburg, Navy Admiral Mikhail Motsak told a meeting
  of families that the submarine had established contact, that there were no casualties,
  that supplies were being delivered. None of this was true. On August 22, three days after
  Norwegian divers had opened the hatch and confirmed that all 118 crew members were dead,
  a Navy officer appeared to tell the families. Nadezhda Tylik, whose son Sergei was among
  the dead, collapsed in grief during the meeting. A uniformed nurse sedated her on camera.
  The scene was broadcast across Russia. The humanist sees what the operational protocol
  systematically prevented from being registered: the delay's cost was not abstract.
  Captain-Lieutenant Dmitry Kolesnikov, the last known survivor to write a note, was alive
  and writing at 15:15 on August 12 — three hours after the explosions. He and 22 others
  had reached compartment 9. He wrote: "None of us can get to the surface." That note was
  found three months later when the hull was raised. The survivors had time. The humanist's
  reading is that the suffering was specific, named, and entirely preventable — not by
  preventing the torpedo malfunction, but by accepting foreign help within the 72-to-96-hour
  survival window.

engineer: |
  The Russian Northern Fleet operated within a procedural system designed for Soviet-era
  conditions: self-sufficiency, operational security, and a command structure where
  acknowledging failure was professionally and politically costly. The doing mode was fully
  operational. The AS-34 was deployed according to protocol; the LR4 rescue submarine was
  positioned; the rescue ships were on station. The doing mode's precise blindspot: it could
  not model a scenario where the correct action was to stop doing — to acknowledge that the
  established protocol was producing escalating failure and replace it with a capability it
  didn't possess. The Norwegian rescue team arrived August 20 and opened the hatch the
  following day. The Russian Navy had been attempting for six days with assets that had
  failed nine times. The engineer's insight is architectural: a system built for procedural
  compliance cannot self-correct when the procedure is the problem. The doing mode had no
  feedback mechanism for "this protocol is killing people; stop it."

archetype_dominant: engineer
