case_id: who-pandemic-accord-pabs-annex
title: "The Blank Article: The WHO Pandemic Agreement and the Mechanism It Cannot Finish"
case_type: documented
mode: prospective
scale: international
region: "Global (Geneva, Switzerland — WHO HQ; ~194 member states; primary fracture: LMIC coalitions vs. high-income-country blocs)"
recency: recent
year: "2024–2026"
rubric_version: 1

# ── THREE PERSPECTIVES (all required before prose) ───────────────────────────

scientist: >
  The Scientist sees a calibration failure: the WHO Pandemic Agreement was designed to
  prevent the equity failure of COVID-19, but its core mechanism — Article 12's Pathogen
  Access and Benefit Sharing (PABS) system — is still unwritten. The Agreement was adopted
  May 20, 2025 at WHA-78, but the Annex specifying how benefit-sharing actually works was
  deferred to WHA-79 (2026). The Scientist asks the diagnostic question: what, empirically,
  caused COVAX's equity failure? The answer is not that countries failed to promise equity;
  they promised it continuously. The answer is that the mechanism operated as voluntary
  purchase and political charity rather than pre-committed legal obligation, which meant it
  unravelled the moment domestic political pressure intensified. The Scientist notes that
  the PABS Annex is precisely the gap between aspiration and mechanism — and that a mechanism
  without operational specificity is an aspiration with extra steps. The Scientist also notes
  that "20%" (the proposed set-aside) is not a scientific question; what the evidence
  addresses is what threshold of production pre-commitment is required to supply LMICs
  before domestic demand stabilises in high-income markets.

humanist: >
  The Humanist sees the same story twice. COVID-19 killed disproportionately in countries
  that could not manufacture their own vaccines and had no legal claim on those who could.
  COVAX was built on goodwill and donor pledges; it arrived late, at reduced volumes, and
  after rich-country populations were already vaccinated. The Humanist notes that solidarity
  rhetoric — "pandemic cannot end until everyone is safe" — was abundant during COVID-19
  and coexisted with vaccine export bans (India's Serum Institute in 2021), domestic
  stockpiling, and TRIPS waiver obstruction. The WHO negotiations of 2022–2025 reproduced
  the same pattern: equity language in the preamble, ambiguity in the operative article,
  and the Annex — the place where the mechanism would actually live — left blank. The
  Humanist observes that the 100-country LMIC bloc's insistence on mandatory benefit-sharing
  is not an abstract negotiating position; it is the lived memory of watching their
  populations die while the vaccines they needed sat in warehouses elsewhere.

engineer: >
  The Engineer sees a mechanism design problem disguised as a political problem. The PABS
  Annex must answer a specific operational question: when country A shares a pathogen
  sample and genomic sequence data, and that data is used to develop a vaccine in country B,
  how many doses does country A receive, when, at what price, through what logistics channel,
  and who enforces the claim if manufacturer C declines? None of these questions are
  answered in the current Agreement text. The 20% set-aside (10% free, 10% at affordable
  prices) is a headline number with no operational definition. The Engineer notes that
  the PABS Annex is the binding constraint: the Agreement cannot open for signatures until
  it is adopted. The Engineer also notes that a mechanism designed for peacetime behavior
  — sharing and trading in a stable environment — will face entirely different conditions
  during a PHEIC: production shortfalls, export bans, domestic political pressure, and
  legal ambiguity about which manufacturer falls within the system's scope.

archetype_dominant: humanist
crowded_out_mode: >
  thinking — the feeling mode (equity solidarity rhetoric, the moral urgency of "never again
  COVID-19") dominated the public and political discourse throughout the negotiations,
  crowding out careful institutional-design thinking about what mechanism actually produces
  equitable outcomes during a genuine emergency rather than in peacetime aspiration

# ── DIAGNOSIS ─────────────────────────────────────────────────────────────────

scientific_facts: >
  WHO Pandemic Agreement formally adopted May 20, 2025, WHA-78, Geneva. Article 12 covers
  PABS. The PABS Annex — specifying operational details of benefit-sharing — deferred to
  WHA-79 (2026). The Agreement cannot open for signatures until the Annex is adopted.
  INB-12 (November 4–15, 2024, Geneva) failed to reach final agreement; INB-13 resumed
  (April 7–12 + April 15, 2025) concluded April 16, 2025 with draft text. Proposed
  set-aside: 20% of pandemic product production — 10% donated at no cost, 10% at affordable
  prices — from manufacturers that participate in the PABS system and use WHO-shared pathogen
  samples or genomic sequence data. US withdrew from WHO under the Trump administration
  in early 2025; the Agreement was adopted without US participation. Co-chairs of INB:
  Precious Matsoso (South Africa) and Anne-Claire Amprou (France). Primary unresolved
  sticking points at adoption: Article 11 (technology transfer — mandatory vs. voluntary)
  and Article 12 (PABS Annex — blank).

social_facts: >
  Approximately 100 LMICs (Africa Group, developing country coalitions) pushed for
  mandatory, legally binding benefit-sharing as the explicit quid pro quo for agreeing to
  rapidly share pathogen samples. Their political memory: COVAX's failure, pandemic vaccine
  nationalism, TRIPS waiver obstruction. High-income countries and the International
  Federation of Pharmaceutical Manufacturers (IFPMA) insisted technology transfer be
  voluntary and on "mutually agreed terms," protecting the pharmaceutical innovation
  ecosystem and patent regimes. The solidarity rhetoric ("no one is safe until everyone is
  safe") was universally deployed; the mechanism disputes were bilateral and technical.
  The PABS Annex's blankness at adoption reflects a genuine political impasse, not a
  drafting oversight.

political_realities: >
  The US withdrawal from WHO removed the world's largest pharmaceutical market and largest
  bilateral health funder from the Agreement's scope, reducing both the mechanism's
  leverage and its resource base. China's position evolved during negotiations; its
  relationship with the LMIC bloc on equity provisions was complex. The pharmaceutical
  industry's influence on high-income country positions was substantial and acknowledged.
  The INB's "nothing is agreed until everything is agreed" principle meant the nearly-agreed
  articles (17 of 35 fully agreed by INB-12) were held hostage to the unresolved ones.
  WHA-79 (2026) is the next deadline for the Annex; failure to adopt it there would leave
  the Agreement formally non-operational indefinitely.

uncertainty_and_ambiguity:
  uncertainty: >
    Whether any mechanism pre-committed in peacetime will actually be honored during a
    pandemic. Whether the 20% set-aside is sufficient to meaningfully supply LMICs before
    domestic demand stabilises in rich countries. Whether manufacturers outside the formal
    PABS system (those who do not use WHO-shared materials) can be compelled to participate.
  ambiguity: >
    "Mutually agreed terms" means something entirely different to LMIC negotiators
    (a bilateral negotiation where they have leverage) than to pharma (a standard commercial
    arrangement where they set terms). "Benefit sharing" means a legal right to LMICs and
    a charitable contribution to high-income countries. "Adequate" volumes and "timely"
    delivery have no shared definition.

key_tensions:
  - "LMIC sovereignty over biological resources (pathogens originate in their territories) vs. global public goods (genomic data as shared heritage)"
  - "Mandatory equity provisions (the only mechanism that survives domestic political pressure in rich countries during a crisis) vs. pharmaceutical innovation incentives (IP protection and voluntary participation as preconditions for industry engagement)"
  - "Agreement as legal instrument (signable, ratifiable, enforceable) vs. Agreement as political signal (declaring the principle of equity without committing to a mechanism)"

problem_definition: >
  WHO member states have adopted a Pandemic Agreement whose core equity mechanism —
  the PABS Annex — is blank. Before WHA-79 (2026), they must negotiate operational
  language that is specific enough to actually distribute vaccines during a PHEIC, and
  politically acceptable enough to retain high-income country signatures and pharmaceutical
  industry participation.

# ── METAPHORS ─────────────────────────────────────────────────────────────────

one_plus_one: >
  LMIC negotiators were answering: "What legal guarantee ensures our populations receive
  vaccines during the next pandemic?" High-income negotiators were answering: "What
  political commitment demonstrates good faith without legally binding our pharmaceutical
  sector?" Both called the answer "benefit-sharing." 1+1 produced two entirely different
  Annexes — one legally operative, one declaratory — that needed to be a single document.

where_is_x: >
  The clause in the PABS Annex that defines the trigger and measurement of benefit-sharing
  obligations. Currently this clause does not exist. The intervention point is the
  drafting moment for this clause in the WHA-79 Annex negotiation — specifically, whether
  "benefit-sharing" is defined as a static percentage (politically contested, revocable
  under pressure) or as a formula that automatically calculates allocations based on what
  was contributed. The precise fulcrum: whether the obligation is ex ante (committed at
  the moment of pathogen sharing) or ex post (negotiated at the moment of production),
  because ex ante commitments survive political crises and ex post ones do not.

eighteenth_camel: >
  A pandemic preparedness credit system: when a country shares pathogen samples and genomic
  sequence data with WHO, it earns denominated "preparedness credits" in a WHO-administered
  ledger, valued in product-equivalent units calibrated to the severity of the potential
  pandemic. When a declared PHEIC uses those materials to produce vaccines or therapeutics,
  credit-holders receive product allocations that mature from the ledger automatically —
  without a new political negotiation at the moment of crisis. This is neither the mandatory
  percentage the LMIC bloc demands nor the voluntary goodwill the pharma bloc offers; it
  is a pre-committed contractual claim created at the moment of sharing, not at the moment
  of production. It converts equity from charity into a kind of pre-paid insurance, makes
  the obligation legible to both pharmaceutical manufacturers (a known future liability)
  and to LMIC governments (a legal claim, not a donor request). It also creates an
  incentive for rapid pathogen sharing: more sharing yields more credits.

solomon_check: >
  Rich-country negotiators who have spent three years arguing that mandatory benefit-sharing
  would "undermine pharmaceutical innovation" were simultaneously the governments that
  deployed regulatory emergency authorities to mandate domestic production during COVID-19.
  They know that governments can override pharmaceutical preferences when political pressure
  demands it. The question they are not directing inward is: if we can mandate production
  for our populations, why can we not pre-commit a fraction of that mandated production
  to a legal LMIC claim? The answer — that domestic political pressure operates differently
  than international obligation — is exactly the problem the Annex needs to solve, not
  a reason not to solve it.

urgency_vs_actionability: >
  The urgency framing ("the next pandemic is coming") has been continuous since 2020 and
  has not produced operational specificity. The PABS Annex is blank not because the urgency
  was underestimated but because urgency produced solidarity rhetoric faster than
  institutional design capacity. The gap between "we must do this" and "here is how this
  works during a PHEIC when factories are running at capacity and governments are imposing
  export controls" is precisely where the Annex negotiations broke down.

# ── CONDITIONS, CAPACITY, CONSTRAINTS ────────────────────────────────────────

enabling_conditions:
  - "The adopted Agreement text (May 2025) creates a political and legal frame that does not require renegotiating first principles"
  - "The PABS Annex's deferred status means it is a specific, bounded negotiating task, not the entire Agreement"
  - "COVID-19's documented equity failure provides the shared evidentiary record that makes the status quo politically costly to defend"
  - "The pandemic preparedness credit concept (or similar financial-mechanism framing) is technically feasible within WHO's existing administrative capacity"

capacities:
  - "WHO's INB and Director-General can table specific Annex language for member state review"
  - "The 100-LMIC bloc has sufficient votes to block weak Annex text at WHA-79"
  - "High-income countries can negotiate side agreements with pharmaceutical manufacturers on indemnity and pre-purchasing that make mandatory set-asides financially palatable"

constraints:
  binding: >
    The Agreement cannot open for signatures without the Annex. This creates a deadline
    (WHA-79, 2026) but also a leverage inversion: countries that want the Agreement to
    function (LMICs) need the Annex, but countries that can afford to wait (HICs) are less
    motivated. The binding constraint is political will to commit ex ante obligations in
    an uncertain future crisis.
  others:
    - "US absence from WHO removes the largest pharmaceutical market from the mechanism's scope"
    - "Manufacturers not using WHO-shared materials are not legally reachable by the PABS system"
    - "No existing WHO administrative infrastructure for managing a preparedness credit ledger"

# ── DECISION PATHWAY ─────────────────────────────────────────────────────────

decision_pathway: >
  Reframe — the negotiation has been stuck in a binary (mandatory percentage vs. voluntary
  goodwill) that both sides reject. Reframing the mechanism as a pre-committed contract
  created at the moment of pathogen sharing (not a percentage allocated at the moment of
  production) shifts the question from "how much are you willing to give us during a crisis?"
  to "what is the legal value of the sharing contribution you are already making?" This
  reframe is tractable for both sides: LMICs get a legal claim, not a donation; pharma
  gets a known and finite liability; HICs get a defensible domestic narrative (reciprocity,
  not charity). WHO Director-General Tedros and Co-Chair Matsoso act as the architects of
  this reframe, tabling specific Annex language that operationalises preparedness credits
  before WHA-79.

tools:
  - tool: "Pandemic preparedness credit ledger (WHO-administered)"
    purpose: "Convert pathogen-sharing contributions into pre-committed, legally enforceable product allocation rights"
    change: "Transforms the benefit-sharing obligation from a political negotiation at crisis-time to a contractual claim established at sharing-time; changes interaction between WHO, member states, and manufacturers from charity to contract"
  - tool: "Joint technical panel on Annex operationalisation"
    purpose: "Produce a shared factual basis for what '10% at no cost' means in production-equivalent terms across different pandemic scenarios"
    change: "Moves the negotiation from competing political assertions to a shared technical reference; changes the learning dynamic from adversarial to joint modelling"
  - tool: "Manufacturer participation agreement with liability clarity"
    purpose: "Give pharmaceutical companies the legal certainty (known liability cap, indemnity provisions) they need to commit to PABS participation"
    change: "Reduces industry opposition to mandatory set-asides by converting an open-ended exposure into a defined obligation; changes coordination between HICs and their pharmaceutical sectors"

metrics:
  - metric: "Proportion of total pandemic product production covered by PABS agreements at adoption"
    measure: "Percentage of global vaccine and therapeutic manufacturing capacity signed into PABS at WHA-79"
    method: "WHO registry of manufacturer participation agreements, audited annually"
  - metric: "Time from PHEIC declaration to first PABS product delivery to LMIC"
    measure: "Days between PHEIC declaration and first batch delivery under PABS obligations"
    method: "WHO tracking system benchmarked against COVAX baseline (median 8 months for first COVAX deliveries during COVID-19)"
  - metric: "Preparedness credit redemption rate during declared PHEIC"
    measure: "Percentage of credit-holders who successfully redeem claims within 90 days of eligibility"
    method: "WHO ledger audit; published by WHO Secretariat within 180 days of each PHEIC resolution"

ninety_day_commitment: >
  Prospective (live recommendation): Within 90 days of WHA-78's adjournment (by August
  2025), WHO Secretariat tables a draft Annex with three fully-specified alternative
  mechanisms — the preparedness credit model, a tiered purchase obligation model, and a
  manufacturer participation agreement model — each with full operational detail including
  trigger conditions, calculation methodology, administrative infrastructure requirements,
  and dispute resolution mechanism. Member states receive these as technical documents, not
  political positions, enabling the WHA-79 negotiation to choose among specified options
  rather than negotiating in the abstract.

# ── STRESS TEST ───────────────────────────────────────────────────────────────

stress_test:
  political: >
    A new pandemic PHEIC could be declared before WHA-79, converting the abstract Annex
    negotiation into a live crisis where rich countries impose export controls and LMIC
    claims are moot — which would prove the LMIC case but likely destroy the negotiating
    momentum for any binding mechanism, as HICs circle the wagons domestically.
  institutional: >
    Pharmaceutical industry lobbying of HIC governments could harden negotiating positions
    before the Annex is finalised, particularly if a new administration in any major
    pharmaceutical country reframes the Agreement as a regulatory threat.
  assumption: >
    The preparedness credit reframe assumes manufacturers will accept a known, bounded PABS
    liability. If manufacturers calculate that any mandatory set-aside obligation creates
    sufficient uncertainty to warrant non-participation in the PABS system altogether,
    the mechanism covers no one.
  resource: >
    WHO lacks the administrative infrastructure to run a preparedness credit ledger at
    the required scale. The IT system, audit capacity, and legal team to manage a global
    product allocation mechanism do not currently exist at WHO Secretariat.
  failure_within_12_months: >
    If the WHA-79 Annex negotiation reproduces the INB-12 dynamic — majority agreement,
    intractable minority, nothing adopted — the Agreement will remain non-operational
    indefinitely, which is worse than no Agreement: it creates the political appearance
    of action without the legal substance of obligation.

revised_problem_definition: >
  WHO member states must negotiate PABS Annex language that is specific enough to distribute
  vaccines during an actual PHEIC (not just in peacetime aspiration), politically acceptable
  enough to retain HIC signatures and pharmaceutical industry participation despite the
  US's absence from the system, and legally durable enough to survive the domestic political
  pressure that will arise in any rich country the moment a new pandemic begins and their
  own population's demands intensify. The stress test reveals: the constraint is not the
  technical design of the mechanism. It is the governance gap between what a treaty can
  commit and what a government will honour when the choice is its own population's survival
  vs. a pre-committed legal claim by another country's population.

# ── HONESTY ──────────────────────────────────────────────────────────────────

flag: >
  Any mechanism that pre-commits rich-country vaccine production to LMIC distribution
  during an emergency will face exactly the same political pressure as COVAX: executive
  orders, export bans, domestic mandates, and a legal argument that no international
  treaty overrides the government's duty to its own population. The PABS Annex can be
  more precisely drafted than COVAX was designed. It cannot be more legally binding than
  the governments that signed it are willing to be when their own populations are dying.
  Principled pragmatism can design the mechanism; it cannot design the political will to
  honour it when the emergency arrives. That gap — between legal commitment and political
  survival — is the limitation this episode reveals that the framework does not resolve.

